plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.ideate.ideate"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.ideate.ideate"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

tasks.whenTaskAdded { task ->
    if (task.name.contains("AarMetadata")) {
        task.enabled = false
    }
}

// -----------------------------------------------------------
// Post‑assemble hook to ensure the APK is copied to a known location
// -----------------------------------------------------------
afterEvaluate {
    android.applicationVariants.all { variant ->
        if (variant.buildType.name == "debug") {
            variant.assembleProvider.configure { assembleTask ->
                assembleTask.doLast {
                    // Flutter may place the APK in build/app/outputs/flutter-apk/
                    def possibleApk = file("${buildDir}/outputs/flutter-apk/app-debug.apk")
                    // Fallback: sometimes the APK is directly under outputs/apk/debug/
                    if (!possibleApk.exists()) {
                        possibleApk = file("${buildDir}/outputs/apk/debug/app-debug.apk")
                    }

                    if (possibleApk.exists()) {
                        def destDir = file("${buildDir}/outputs/apk/debug")
                        destDir.mkdirs()
                        copy {
                            from possibleApk
                            into destDir
                        }
                        println "✅ APK copied to: ${destDir}/app-debug.apk"
                    } else {
                        println "⚠️ No APK found at expected locations."
                    }
                }
            }
        }
    }
}


